name: Deploy Dockett on AWS

on:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm check-types

  publish-and-deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "::error::Set the DOCKERHUB_USERNAME repository variable."; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "::error::Set the DOCKERHUB_TOKEN repository secret."; exit 1; }
          test -n "$NEXT_PUBLIC_GOOGLE_CLIENT_ID" || { echo "::error::Set NEXT_PUBLIC_GOOGLE_CLIENT_ID as a repository variable to keep Google sign-in enabled."; exit 1; }

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push combined application image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          cache-from: type=gha,scope=dockett-app
          cache-to: type=gha,mode=max,scope=dockett-app
          build-args: |
            NEXT_PUBLIC_API_URL=/trpc
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_SALES_EMAIL=${{ vars.NEXT_PUBLIC_SALES_EMAIL }}
            NEXT_PUBLIC_SALES_WHATSAPP=${{ vars.NEXT_PUBLIC_SALES_WHATSAPP }}
            NEXT_PUBLIC_SALES_PHONE=${{ vars.NEXT_PUBLIC_SALES_PHONE }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/dockett-app:latest
            ${{ vars.DOCKERHUB_USERNAME }}/dockett-app:${{ github.sha }}

      - name: Prepare EC2 storage for deployment files
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            set -eu
            target=/home/ubuntu/dockett

            if [ ! -d "$target" ] || [ ! -w "$target" ]; then
              echo "Deployment target is missing or not writable: $target" >&2
              exit 1
            fi

            echo "Disk space before safe Docker cleanup:"
            df -h "$target" /tmp
            docker system df || true

            docker image prune --force
            docker builder prune --all --force

            echo "Disk space after safe Docker cleanup:"
            df -h "$target" /tmp

            available_kb=$(df -Pk "$target" | awk 'NR == 2 { print $4 }')
            if [ -z "$available_kb" ] || [ "$available_kb" -lt 65536 ]; then
              echo "Less than 64 MiB is available at $target after cleanup; refusing to start file transfer." >&2
              docker system df >&2 || true
              exit 1
            fi

      - name: Copy Compose file to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          source: docker-compose.yml,Caddyfile,deploy.sh
          target: /home/ubuntu/dockett
          overwrite: true

      - name: Deploy images to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/dockett
            bash ./deploy.sh ${{ github.sha }}
